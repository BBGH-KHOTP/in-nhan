<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    /* THIẾT KẾ CHUẨN A4 */
    @page {
      size: A4;
      margin: 15mm;
    }
    body {
      font-family: "Times New Roman", Times, serif;
      margin: 0;
      padding: 0;
      background-color: #fff;
    }
    .page {
      width: 180mm;
      margin: auto;
    }
    
    /* HEADER */
    .header-table { width: 100%; border: none; font-size: 11pt; }
    .title { 
      text-align: center; 
      font-weight: bold; 
      font-size: 16pt; 
      margin: 20px 0 10px 0; 
      text-transform: uppercase;
    }
    .sub-title { text-align: center; font-style: italic; font-size: 11pt; margin-bottom: 20px; }

    /* INFO */
    .info-section { margin-bottom: 10px; font-size: 12pt; line-height: 1.6; }
    .dotted-line { border-bottom: 1px dotted #000; flex-grow: 1; padding-left: 5px; }
    .info-row { display: flex; margin-bottom: 5px; }

    /* TABLE CHI TIẾT */
    table.main-table { 
      width: 100%; 
      border-collapse: collapse; 
      margin-top: 10px; 
      font-size: 11pt;
    }
    table.main-table th, table.main-table td { 
      border: 1px solid black; 
      padding: 8px 4px; 
      text-align: center; 
    }
    table.main-table th { background-color: #f2f2f2; font-weight: bold; }

    /* FOOTER CHỮ KÝ */
    .footer-section { 
      margin-top: 20px; 
      display: grid; 
      grid-template-columns: 1fr 1fr 1fr; 
      text-align: center;
      font-size: 11pt;
    }
    .footer-col { 
      display: flex; 
      flex-direction: column; 
      align-items: center;
    }
    
    /* VÙNG TÊN NGƯỜI KÝ DƯỚI CÙNG */
    .name-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      text-align: center;
      margin-top: 60px; /* Khoảng cách tạo không gian ký tên */
      font-weight: bold;
      font-size: 11pt;
    }

    /* ĐIỀU KHIỂN IN */
    @media print {
      .no-print { display: none !important; }
      body { margin: 0; }
    }
    .btn-print { 
      position: fixed; top: 20px; right: 20px; 
      padding: 10px 20px; background: #d32f2f; color: white; 
      border: none; border-radius: 5px; cursor: pointer; font-weight: bold;
    }
    .loading { text-align: center; margin-top: 100px; font-style: italic; }
  </style>
</head>
<body>
  <button class="btn-print no-print" onclick="window.print()">🖨️ In phiếu</button>

  <div class="page">
    <div id="content">
      <div class="loading">Đang tải dữ liệu phiếu xuất kho...</div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    const idPhieu = new URLSearchParams(location.search).get('id') || '';

    window.onload = function() {
      callApi('api_phieu', idPhieu)
        .then(renderPhieu)
        .catch(function (err) {
          document.getElementById('content').innerHTML =
            '<h3 style="color:red">Lỗi: ' + err.message + '</h3>';
        });
    };

    function renderPhieu(data) {
      if (data.error) {
        document.getElementById('content').innerHTML = `<h3 style="color:red">${data.error}</h3>`;
        return;
      }

      const { thongTinChung, chiTietVatTu } = data;
      
      let rows = chiTietVatTu.map((item, index) => `
        <tr>
          <td>${index + 1}</td>
          <td>${item.maSP}</td>
          <td style="text-align:left">${item.tenSP}</td>
          <td>${item.dvt}</td>
          <td>${item.soLuong}</td>
          <td>${item.ghiChu || ''}</td>
        </tr>
      `).join('');

      for(let i = chiTietVatTu.length; i < 8; i++) {
        rows += `<tr><td>${i+1}</td><td></td><td></td><td></td><td></td><td></td></tr>`;
      }

      const html = `
        <table class="header-table">
          <tr>
            <td style="width:60%">
              <b>Đơn vị: CÔNG TY TNHH TỔ HỢP CƠ KHÍ THACO</b><br>
              <b>Bộ phận: Kho vật tư</b>
            </td>
            <td style="text-align:center">
              <b>Mẫu số: 02 - VT</b><br>
              <small>(Ban hành theo TT số: 200/2014/TT- BTC<br>Ngày 22/12/2014 của Bộ trưởng BTC)</small>
            </td>
          </tr>
        </table>

        <div class="title">PHIẾU XUẤT KHO</div>
        <div class="sub-title">Số: ${thongTinChung.soPhieu}</div>

        <div class="info-section">
          <div class="info-row">- Họ tên người nhận: <span class="dotted-line"></span></div>
          <div class="info-row">- Lý do xuất kho: <span class="dotted-line">${thongTinChung.lyDo || ''}</span></div>
          <div class="info-row">- Nhập tại kho: <span class="dotted-line">${thongTinChung.kho || ''}</span></div>
        </div>

        <table class="main-table">
          <thead>
            <tr>
              <th style="width:5%">Stt</th>
              <th style="width:15%">Mã SP</th>
              <th style="width:35%">Tên sản phẩm</th>
              <th style="width:10%">Đơn vị tính</th>
              <th style="width:10%">Số lượng</th>
              <th style="width:25%">Ghi chú</th>
            </tr>
          </thead>
          <tbody>
            ${rows}
            <tr style="font-weight:bold">
              <td colspan="4">TỔNG CỘNG</td>
              <td>${thongTinChung.tongSL}</td>
              <td></td>
            </tr>
          </tbody>
        </table>

        <div class="footer-section">
          <div class="footer-col">
            <div style="height: 18px;"></div>
            <b>Người giao</b>
            <i>(Ký, họ tên)</i>
          </div>
          <div class="footer-col">
            <div style="height: 18px;"></div>
            <b>Người nhận</b>
            <i>(Ký, họ tên)</i>
          </div>
          <div class="footer-col">
            <i>Ngày ${thongTinChung.ngay}</i>
            <b>Người lập phiếu</b>
            <i>(Ký, họ tên)</i>
          </div>
        </div>

        <div class="name-row">
          <div></div> <div></div> <div>${thongTinChung.nguoiTao}</div> </div>
      `;
      document.getElementById('content').innerHTML = html;
    }
  </script>
</body>
</html>
