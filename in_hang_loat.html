<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    @page {
      size: 60mm 40mm;        /* Rộng 60mm × Cao 40mm - Khổ ngang */
      margin: 0 !important;
    }

    * { box-sizing: border-box; }

    body { 
      margin: 0; 
      padding: 20px;
      background: #f0f0f0; 
      font-family: "Cambria", "Times New Roman", serif; 
    }

    .btn-print { 
      position: fixed; top: 10px; right: 10px; 
      padding: 10px 20px; background: #d32f2f; 
      color: white; border: none; border-radius: 5px; 
      cursor: pointer; font-weight: bold; z-index: 1000; 
    }

    .label-wrapper {
      width: 60mm;
      height: 40mm;
      margin: 15px auto;
      page-break-after: always;
      break-after: page;
    }

    .label-container {
      width: 60mm;
      height: 40mm;
      border: 1px dashed #000;           /* Chỉ hiện trên màn hình */
      background: white;
      margin: 0 auto;
      padding: 1.5mm 1.5mm 1.5mm 1mm;
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 24mm;     /* Cột text + cột QR */
      grid-template-rows: repeat(7, auto);
    }

    /* ==================== ROWS ==================== */
    .id-row {
      display: flex; 
      align-items: center; 
      grid-column: 1 / span 2;
      margin-bottom: 0.8mm;
      width: 100%; /* Đảm bảo dòng ID kéo giãn hết chiều ngang nhãn */
    }
    .id-row b { font-size: 9pt; white-space: nowrap; }
    .id-row span { font-size: 9pt; }
    
    /* ĐÃ SỬA: Tự động đẩy hẳn phần Vị trí sát về lề bên phải */
    .ke-badge { 
      font-size: 9pt; 
      font-weight: bold; 
      color: #d32f2f; 
      white-space: nowrap; 
      margin-left: auto; /* Lệnh Flexbox đẩy phần tử qua sát rìa phải */
      padding-right: 0.5mm; /* Khoảng cách an toàn nhỏ so với mép viền */
    }

    .ten-row {
      display: flex; 
      align-items: flex-start;
      grid-column: 1 / span 2;
      margin-bottom: 0.8mm;
    }
    .ten-row b { 
      font-size: 9pt; 
      white-space: nowrap; 
      flex-shrink: 0; 
    }
    .product-name {
      font-weight: bold; 
      font-size: 9pt;
      line-height: 1.2;
      flex-grow: 1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    .info-row {
      display: flex; 
      align-items: center;
      grid-column: 1 / span 2;
      margin-bottom: 0.7mm;
    }
    .info-row b { 
      font-size: 9pt; 
      white-space: nowrap; 
    }
    .info-row span { font-size: 9pt; }

    /* QR Code */
    .qrcode-box {
      position: absolute;
      right: 1.5mm;
      bottom: 1.5mm;
      width: 24mm;
      height: 24mm;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qrcode-box img { 
      width: 100%; 
      height: 100%; 
      object-fit: contain; 
    }

    /* ==================== PRINT MODE (Không lề) ==================== */
    @media print {
      .no-print { display: none !important; }
      body { 
        padding: 0 !important; 
        background: white !important; 
      }

      .label-wrapper {
        margin: 0 !important;
        width: 60mm !important;
        height: 40mm !important;
        page-break-after: always !important;
      }

      .label-container {
        border: none !important;
        margin: 0 !important;
        padding: 1.2mm 1.2mm 1.2mm 0.8mm !important;
      }
    }
  </style>
</head>
<body>
  <button class="btn-print no-print" onclick="window.print()" id="btn">🖨️ In tất cả</button>
  <div id="zone"><p style="padding:20px">⏳ Đang tải...</p></div>

  <script src="config.js"></script>
  <script>
    const p = new URLSearchParams(location.search);
    const items = parseRows(p.get('ct')).map(function (r) {
      return { id_sp: r[0] || '', ten: r[1] || '', ma: r[2] || '', ngay: r[3] || '',
               so_luong: r[4] || '', HSD: r[5] || '', po: r[6] || '' };
    });
    const zone = document.getElementById('zone');

    if (!items.length) {
      zone.innerHTML = '<h3 style="color:red;padding:20px">Không có dữ liệu nhãn (thiếu tham số ct)</h3>';
    } else {
      document.getElementById('btn').textContent = '🖨️ In tất cả (' + items.length + ' nhãn)';

      zone.innerHTML = items.map(function (d) { return `
        <div class="label-wrapper">
          <div class="label-container">
            <div class="id-row"><div><b>ID SP: </b><span>${d.id_sp}</span></div></div>
            <div class="ten-row"><b>TÊN SP: </b><span class="product-name">${d.ten}</span></div>
            <div class="info-row"><b>MÃ SP: </b><span>${d.ma}</span></div>
            <div class="info-row"><b>NGÀY: </b><span>${d.ngay}</span></div>
            <div class="info-row"><b>SỐ LƯỢNG: </b><span>${d.so_luong}</span></div>
            <div class="info-row"><b>HSD:</b><span>${d.HSD}</span></div>
            <div class="info-row"><b>PO: </b><span>${d.po}</span></div>
            <div class="qrcode-box"><img src="${qrUrl(d.id_sp)}" alt="QR"></div>
          </div>
        </div>`; }).join('');

      document.querySelectorAll('.product-name').forEach(function (el) {
        for (const size of [9, 8, 7, 6.5]) {
          el.style.fontSize = size + 'pt';
          if (el.scrollHeight <= 28) break;
        }
      });
    }
  </script>
</body>
</html>
