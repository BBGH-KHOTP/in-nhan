<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>In nhãn</title>
  <style>
    @page { size: 60mm 40mm; margin: 0 !important; }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px; background: #f0f0f0;
      font-family: "Cambria", "Times New Roman", serif;
    }
    .btn-print {
      position: fixed; top: 10px; right: 10px; padding: 10px 20px;
      background: #d32f2f; color: white; border: none; border-radius: 5px;
      cursor: pointer; font-weight: bold; z-index: 1000; box-shadow: 0 3px 8px rgba(0,0,0,0.25);
    }
    .btn-print:disabled { background: #999; cursor: wait; }
    .label-wrapper { width: 60mm; height: 40mm; margin: 15px auto; }
    .label-container {
      width: 60mm; height: 40mm; border: 1px dashed #000; background: white; margin: 0 auto;
      padding: 1.5mm 2mm; position: relative; overflow: hidden;
      display: grid; grid-template-columns: 32mm 24mm; grid-template-rows: auto auto 1fr; gap: 0.5mm 0;
    }
    .top-header-row {
      grid-column: 1 / span 2; display: flex; align-items: center; padding-bottom: 0.5mm;
    }
    .top-header-row b, .top-header-row span { font-size: 9pt; }
    .ke-badge {
      font-size: 9pt; font-weight: bold; color: #d32f2f; white-space: nowrap;
      margin-left: auto; padding-right: 1.5mm;
    }
    .ten-row {
      grid-column: 1 / span 2; display: flex; align-items: flex-start;
      margin-top: 0.5mm; min-height: 4.5mm; max-height: 8.5mm; overflow: hidden;
    }
    .ten-row b { font-size: 9pt; white-space: nowrap; padding-right: 1mm; flex-shrink: 0; }
    .product-name {
      font-weight: bold; font-size: 9pt; line-height: 1.15; flex-grow: 1;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; word-break: break-word;
    }
    .info-row { grid-column: 1 / 2; display: flex; align-items: center; width: 100%; overflow: hidden; }
    .info-row b { font-size: 9pt; white-space: nowrap; flex-shrink: 0; }
    .info-row span { font-size: 9pt; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .qrcode-box {
      position: absolute; right: 2mm; bottom: 1.5mm; width: 22mm; height: 22mm;
      display: flex; align-items: center; justify-content: center; background: white;
    }
    .qrcode-box img { width: 100%; height: 100%; object-fit: contain; image-rendering: crisp-edges; }

    @media print {
      .no-print { display: none !important; }
      body { padding: 0 !important; background: white !important; }
      .label-wrapper { margin: 0 !important; page-break-after: always !important; }
      .label-container { border: none !important; margin: 0 !important; }
    }
  </style>
</head>
<body>

  <button id="btn-print" class="btn-print no-print" disabled>⏳ Đang tải QR...</button>
  <div id="print-zone"></div>

  <script>
    (function () {
      var btn = document.getElementById('btn-print');
      var printZone = document.getElementById('print-zone');

      try {
        // ===== 1. Đọc tham số từ URL (thay cho loadInNhan) =====
        var p = new URLSearchParams(window.location.search);
        var d = {
          id_sp: p.get('id') || '',
          vitri: p.get('vitri') || '',
          ke: p.get('ke') || '',
          ten: p.get('ten') || '',
          ma: p.get('ma') || '',
          ngay: p.get('ngay') || '',
          so_luong: p.get('sl') || '',
          dnm: p.get('dnm') || '',
          po: p.get('po') || '',
          loai: p.get('loai') || '',
          sl_nhan: p.get('soluongtrennhan') || ''
        };
        // QR tạo từ ID SP (thay cho generateQRCode)
        d.qr_url = d.id_sp
          ? 'https://api.qrserver.com/v1/create-qr-code/?data=' +
            encodeURIComponent(d.id_sp) + '&size=200x200'
          : '';

        document.title = 'In Nhãn ' + d.id_sp;

        // ===== 2. Hàm chống lỗi/XSS khi chèn vào HTML =====
        function esc(s) {
          return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // ===== 3. Tính số nhãn =====
        var rawSl = String(d.so_luong);
        var totalQty = Number(rawSl.replace(/[^0-9]/g, '')) || 0;
        var labelQty = Number(d.sl_nhan);
        if (!labelQty || labelQty <= 0) labelQty = totalQty;

        if (totalQty <= 0) {
          printZone.innerHTML = '<h3 style="padding:20px;">Số lượng bằng 0 hoặc thiếu tham số, không có nhãn để in.</h3>';
          btn.style.display = 'none';
          return;
        }

        var fullLabelsCount = Math.floor(totalQty / labelQty);
        var remainderQty = totalQty % labelQty;

        var checkLoai = String(d.loai).trim().toLowerCase();
        var isNhap = (checkLoai === 'nhập' || checkLoai === 'nhap');
        var unitText = rawSl.replace(/[0-9.,]/g, '').trim();
        var vitriText = d.ke || d.vitri;

        function createLabelHtml(currentLabelQty) {
          var vitriHtml = vitriText
            ? '<span class="ke-badge">Vị trí: ' + esc(vitriText) + '</span>' : '';
          var soLuongText = isNhap
            ? currentLabelQty + '/' + totalQty + ' ' + unitText
            : d.so_luong;

          return '' +
            '<div class="label-wrapper"><div class="label-container">' +
              '<div class="top-header-row">' +
                '<div><b>ID SP: </b><span>' + esc(d.id_sp) + '</span></div>' + vitriHtml +
              '</div>' +
              '<div class="ten-row"><b>TÊN SP: </b><span class="product-name">' + esc(d.ten) + '</span></div>' +
              '<div class="info-row" style="margin-top:1mm;"><b>MÃ SP: </b><span>' + esc(d.ma) + '</span></div>' +
              '<div class="info-row"><b>NGÀY: </b><span>' + esc(d.ngay) + '</span></div>' +
              '<div class="info-row"><b>SỐ LƯỢNG: </b><span>' + esc(soLuongText) + '</span></div>' +
              '<div class="info-row"><b>DNM: </b><span>' + esc(d.dnm) + '</span></div>' +
              '<div class="info-row"><b>PO: </b><span>' + esc(d.po) + '</span></div>' +
              '<div class="qrcode-box"><img src="' + esc(d.qr_url) + '" alt="QR Code"></div>' +
            '</div></div>';
        }

        // ===== 4. Gom chuỗi rồi gán 1 lần (nhanh hơn) =====
        var html = '';
        for (var i = 0; i < fullLabelsCount; i++) html += createLabelHtml(labelQty);
        if (remainderQty > 0) html += createLabelHtml(remainderQty);
        printZone.innerHTML = html;

        // ===== 5. Tự giảm cỡ chữ tên SP cho vừa khung =====
        document.querySelectorAll('.product-name').forEach(function (el) {
          var sizes = [9, 8, 7.5, 6.5];
          var parent = el.parentElement;
          for (var k = 0; k < sizes.length; k++) {
            el.style.fontSize = sizes[k] + 'pt';
            if (parent.scrollHeight <= parent.clientHeight) break;
          }
        });

        // ===== 6. Chờ QR tải xong mới cho bấm In =====
        var imgs = Array.prototype.slice.call(document.querySelectorAll('.qrcode-box img'));
        var loaded = imgs.map(function (img) {
          return new Promise(function (resolve) {
            if (img.complete) return resolve();
            img.onload = img.onerror = resolve;
          });
        });
        Promise.all(loaded).then(function () {
          btn.disabled = false;
          btn.textContent = '🖨️ In nhãn';
        });
        btn.addEventListener('click', function () { window.print(); });

      } catch (err) {
        printZone.innerHTML = '<h3 style="color:red;padding:20px;">Lỗi xử lý: ' + err.message + '</h3>';
      }
    })();
  </script>
</body>
</html>
