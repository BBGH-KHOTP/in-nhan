<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    /* ── CHUẨN IN A4 ───────────────────────────────────────── */
    @page { size: A4; margin: 10mm 12mm; }

    * { box-sizing: border-box; }

    body {
      font-family: "Times New Roman", Times, serif;
      font-size: 11pt;
      line-height: 1.4;
      margin: 0; padding: 0;
      background: #fff; color: #000;
    }

    .page { width: 185mm; margin: auto; padding: 5mm 0; }

    /* ── HEADER LOGO + MÃ TÀI LIỆU ────────────────────────── */
    .header-wrap {
      display: flex;
      align-items: stretch;
      margin-bottom: 8px;
      border: 1.5px solid #000;
    }
    .header-logo {
      width: 28%;
      flex-shrink: 0;
      border-right: 1.5px solid #000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 8px;
    }
    .header-info {
      width: 72%;
      display: flex;
      align-items: center;
      padding: 6px 10px 6px 12px;
    }
    .logo-img {
      width: 100%;
      max-height: 65px;
      object-fit: contain;
      object-position: center;
      display: block;
    }
    .company-info { font-size: 9pt; line-height: 1.6; }
    .company-info b { font-size: 10pt; text-transform: uppercase; }
    .doc-code-top {
      font-size: 9pt;
      font-family: "Courier New", monospace;
      text-align: right;
      margin-bottom: 2px;
    }
    .doc-code { font-size: 9pt; font-family: "Courier New", monospace; text-align: right; }

    /* ── TIÊU ĐỀ ────────────────────────────────────────────── */
    .title-area { margin: 10px 0 14px; }
    .title-area h1 {
      font-size: 17pt; font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 0 0 4px;
      text-align: center;
    }
    .title-area .sub {
      font-style: italic; font-size: 11pt; margin: 2px 0;
      text-align: right;
    }
    .title-area .so-phieu {
      font-weight: bold; font-size: 12pt; margin: 4px 0 0;
      text-align: right;
    }

    /* ── THÔNG TIN CÁC BÊN ─────────────────────────────────── */
    .party { margin-bottom: 6px; font-size: 11pt; }
    .party-title {
      font-weight: bold; text-transform: uppercase;
      font-size: 11pt; margin-bottom: 2px;
    }
    .party-row {
      display: flex; gap: 4px;
      margin-bottom: 2px; padding-left: 12px;
    }
    .party-label { white-space: nowrap; min-width: 70px; }
    .party-value {
      flex: 1;
      border-bottom: 1px dotted #555;
      min-height: 16px;
      padding: 0 4px;
    }
    .party-row-2col { display: flex; gap: 10px; padding-left: 12px; margin-bottom: 2px; }
    .party-row-2col .half { display: flex; gap: 4px; flex: 1; }
    .party-row-2col .half .party-label { min-width: 60px; }

    /* ── BẢNG CHI TIẾT ─────────────────────────────────────── */
    .intro-text { margin: 8px 0 6px; font-size: 11pt; }

    table.main-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 10.5pt;
    }
    table.main-table th,
    table.main-table td {
      border: 1px solid #000;
      padding: 5px 3px;
      text-align: center;
      vertical-align: middle;
    }
    table.main-table th {
      background: #e8e8e8;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 10pt;
      line-height: 1.3;
    }
    table.main-table td.left { text-align: left; padding-left: 5px; }
    table.main-table tr.total-row td { font-weight: bold; }
    table.main-table tr:nth-child(even) td { background: #fafafa; }
    table.main-table tr.total-row td { background: #f0f0f0 !important; }

    /* ── GHI CHÚ ────────────────────────────────────────────── */
    .note-area { margin-top: 5px; font-size: 10.5pt; }
    .note-area .italic { font-style: italic; }
    .note-area .bold { font-weight: bold; }

    /* ── BẢNG KÝ TÊN ────────────────────────────────────────── */
    table.sign-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 18px;
      table-layout: fixed;
    }
    table.sign-table td {
      border: none;
      text-align: center;
      vertical-align: top;
      padding: 3px 2px;
      font-size: 10pt;
    }
    .sign-title { font-weight: bold; text-transform: uppercase; line-height: 1.3; }
    .sign-sub { font-style: italic; font-size: 9pt; }
    .sign-space { height: 55px; }
    .sign-name { font-weight: bold; font-size: 10pt; min-height: 16px; }

    /* ── NÚT IN ─────────────────────────────────────────────── */
    @media print {
      .no-print { display: none !important; }
      body { margin: 0; }
      table.main-table tr:nth-child(even) td { background: #fff !important; }
    }
    .btn-print {
      position: fixed; top: 16px; right: 16px; z-index: 999;
      padding: 10px 22px;
      background: #1b5e20; color: #fff;
      border: none; border-radius: 6px;
      cursor: pointer; font-weight: bold; font-size: 13px;
      box-shadow: 0 2px 6px rgba(0,0,0,.3);
    }
    .btn-print:hover { background: #2e7d32; }

    /* ── LOADING ─────────────────────────────────────────────── */
    .loading {
      text-align: center; margin-top: 120px;
      font-style: italic; font-size: 13pt; color: #555;
    }
  </style>
</head>
<body>

  <button class="btn-print no-print" onclick="window.print()">🖨️ In Biên Bản</button>

  <div class="page">
    <div id="content">
      <div class="loading">⏳ Đang tải dữ liệu biên bản giao nhận hàng...</div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    // ID phiếu được nhúng từ Apps Script template
    const idPhieu = new URLSearchParams(location.search).get('id') || '';

    window.onload = function () {
      callApi('api_bbgh', idPhieu)
        .then(renderBBGH)
        .catch(function (err) {
          document.getElementById('content').innerHTML =
            '<h3 style="color:red">❌ Lỗi kết nối: ' + err.message + '</h3>';
        });
    };

    function renderBBGH(data) {
      if (data.error) {
        document.getElementById('content').innerHTML =
          '<h3 style="color:red">❌ ' + data.error + '</h3>';
        return;
      }

      const { thongTinChung: tc, chiTietVatTu } = data;

      /* ── Dòng chi tiết vật tư ── */
      const rows = chiTietVatTu.map((item, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${tc.lyDo || ''}</td>
          <td>${item.maSP || ''}</td>
          <td class="left">${item.tenSP || ''}</td>
          <td>${item.dvt || ''}</td>
          <td>${item.soLuong || ''}</td>
          <td></td>
          <td class="left">${item.ghiChu || ''}</td>
        </tr>
      `).join('');

      const html = `
        <!-- ══ HEADER ══════════════════════════════════════ -->
        <div class="doc-code-top">QT.TCMC.VCNB/03-BM02</div>
        <div class="header-wrap">
          <div class="header-logo">
            <img class="logo-img"
              src="https://thacoindustries.com/wp-content/uploads/2023/08/LOGO_24-7-2023-01.png"
              alt="THACO INDUSTRIES">
          </div>
          <div class="header-info">
            <div class="company-info">
              <b>CÔNG TY TNHH TỔ HỢP CƠ KHÍ THACO</b><br>
              Địa Chỉ: KCN Cơ khí Ô tô Chu Lai Trường Hải - Xã Núi Thành - Thành Phố Đà Nẵng<br>
              Điện Thoại: 02353.565.327 &nbsp;&nbsp; MST: 4001264725
            </div>
          </div>
        </div>

        <!-- ══ TIÊU ĐỀ ══════════════════════════════════════ -->
        <div class="title-area">
          <h1>Biên Bản Giao Nhận Hàng</h1>
          <div class="sub">Chu Lai, ngày ${tc.ngayLap || '........'}</div>
          <div class="so-phieu">SỐ: ${tc.soPhieu || ''}</div>
        </div>

        <!-- ══ BÊN GIAO ══════════════════════════════════════ -->
        <div class="party">
          <div class="party-title">A. Bên giao: CÔNG TY TNHH TỔ HỢP CƠ KHÍ THACO</div>
          <div class="party-row">
            <span class="party-label">Địa chỉ:</span>
            <span class="party-value">KCN Cơ khí Ô tô Chu Lai Trường Hải - Xã Núi Thành - Thành Phố Đà Nẵng</span>
          </div>
          <div class="party-row-2col">
            <div class="half">
              <span class="party-label">Đại diện:</span>
              <span class="party-value"></span>
            </div>
            <div class="half">
              <span class="party-label">Điện thoại:</span>
              <span class="party-value"></span>
            </div>
          </div>
        </div>

        <!-- ══ BÊN NHẬN ══════════════════════════════════════ -->
        <div class="party">
          <div class="party-title">B. Bên nhận: ${tc.kho || '........................................'}</div>
          <div class="party-row">
            <span class="party-label">Địa chỉ:</span>
            <span class="party-value">${tc.diaChi || ''}</span>
          </div>
          <div class="party-row-2col">
            <div class="half">
              <span class="party-label">Đại diện:</span>
              <span class="party-value"></span>
            </div>
            <div class="half">
              <span class="party-label">Điện thoại:</span>
              <span class="party-value"></span>
            </div>
          </div>
        </div>

        <!-- ══ BÊN VẬN CHUYỂN ════════════════════════════════ -->
        <div class="party">
          <div class="party-title">C. Bên vận chuyển:</div>
          <div class="party-row-2col">
            <div class="half">
              <span class="party-label">Tên tài xế:</span>
              <span class="party-value"></span>
            </div>
            <div class="half">
              <span class="party-label">Điện thoại:</span>
              <span class="party-value"></span>
            </div>
          </div>
          <div class="party-row">
            <span class="party-label">BSX:</span>
            <span class="party-value"></span>
          </div>
        </div>

        <!-- ══ BẢNG CHI TIẾT ════════════════════════════════ -->
        <div class="intro-text">Các bên tiến hành giao nhận hàng hóa với nội dung sau:</div>

        <table class="main-table">
          <thead>
            <tr>
              <th style="width:4%">STT</th>
              <th style="width:13%">LSX-ĐH</th>
              <th style="width:12%">Mã SP</th>
              <th style="width:30%">Tên Chi Tiết</th>
              <th style="width:6%">ĐVT</th>
              <th style="width:11%">Số lượng</th>
              <th style="width:11%">Khối lượng<br>(Kg)</th>
              <th style="width:13%">Ghi chú</th>
            </tr>
          </thead>
          <tbody>
            ${rows}
            <tr class="total-row">
              <td colspan="4">Tổng cộng</td>
              <td></td>
              <td>${tc.tongSL || ''}</td>
              <td></td>
              <td></td>
            </tr>
          </tbody>
        </table>

        <!-- ══ GHI CHÚ ══════════════════════════════════════ -->
        <div class="note-area">
          <div class="italic">Hàng khô ráo, đúng quy cách</div>
          <div><span class="bold">Ghi chú:</span>
            <span class="italic"> - Biên bản này được lập 03 bản, có giá trị pháp lý như nhau, mỗi bên giữ 01 bản</span>
          </div>
        </div>

        <!-- ══ KÝ TÊN ════════════════════════════════════════ -->
        <table class="sign-table">
          <tr>
            <td><div class="sign-title">Duyệt</div><div class="sign-sub">(Ký, ghi rõ họ tên)</div></td>
            <td><div class="sign-title">P. Chất Lượng</div><div class="sign-sub">(Ký, ghi rõ họ tên)</div></td>
            <td><div class="sign-title">Bên giao</div><div class="sign-sub">(Ký, ghi rõ họ tên)</div></td>
            <td><div class="sign-title">Bảo Vệ</div><div class="sign-sub">(Ký, ghi rõ họ tên)</div></td>
            <td><div class="sign-title">Bên Vận Chuyển</div><div class="sign-sub">(Ký, ghi rõ họ tên)</div></td>
            <td><div class="sign-title">Bên Nhận</div><div class="sign-sub">(Ký, ghi rõ họ tên)</div></td>
            <td><div class="sign-title">Người Lập</div><div class="sign-sub">(Ký, ghi rõ họ tên)</div></td>
          </tr>
          <tr>
            <td class="sign-space"></td>
            <td class="sign-space"></td>
            <td class="sign-space"></td>
            <td class="sign-space"></td>
            <td class="sign-space"></td>
            <td class="sign-space"></td>
            <td class="sign-space"></td>
          </tr>
          <tr>
            <td class="sign-name"></td>
            <td class="sign-name"></td>
            <td class="sign-name"></td>
            <td class="sign-name"></td>
            <td class="sign-name"></td>
            <td class="sign-name"></td>
            <td class="sign-name"></td>
          </tr>
        </table>
      `;

      document.getElementById('content').innerHTML = html;
    }
  </script>
</body>
</html>
